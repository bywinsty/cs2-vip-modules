name: Build VIP Modules
on:
  push:
    branches:
      - Modules
      - dev
  pull_request:
    branches:
      - Modules
  workflow_dispatch:

permissions:
  contents: read

env:
  AMBUILD_REF: d89ec91a7ac2607da07b50bb62346f9a10e9a998
  MMS_REF: 2667e8e5947237c4cb7ea45cec3913ad6a44757c
  HL2SDK_REF: 80cf8554d716a3841fe0680013cae3411a056a8d
  SCHEMAENTITY_REF: e7965b3c83ec684d44584ee6457c5482ee5d9db1
  MANIFEST_REF: 20b3a014264b38908c4a5d4eb263ba2c488f3dc1
  VIP_CORE_REF: 65b0934bec8bbc571ee5be996d2643d75851785b
  CACHE_VERSION: v2

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      modules: ${{ steps.discover.outputs.modules }}
      count: ${{ steps.discover.outputs.count }}
      module_count: ${{ steps.manifest_contract.outputs.module_count }}
      package_file_count: ${{ steps.manifest_contract.outputs.package_file_count }}
      module_archive_count: ${{ steps.manifest_contract.outputs.module_archive_count }}
      release_archive_count: ${{ steps.manifest_contract.outputs.release_archive_count }}
      report_count: ${{ steps.manifest_contract.outputs.report_count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify LF line endings
        run: python3 .github/scripts/check_line_endings.py

      - name: Test package validator
        run: python3 .github/scripts/test_validate_package.py
      - name: Test manifest contract
        run: python3 .github/scripts/test_manifest_contract.py
      - name: Test VIP_MultiTest upgrade preflight
        run: python3 .github/scripts/test_check_vip_multitest_upgrade.py
      - name: Test build target defaults
        run: python3 .github/scripts/test_build_targets.py
      - name: Test dependency cache workflow contract
        run: python3 .github/scripts/test_cache_workflow.py
      - name: Test release workflow contract
        run: python3 .github/scripts/test_release_workflow.py
      - name: Test documentation links
        run: python3 .github/scripts/test_documentation_links.py
      - name: Check canonical module build files
        run: python3 .github/scripts/sync_build_files.py
      - name: Test reproducible archive helper
        run: python3 .github/scripts/test_reproducible_archive.py
      - name: Test SPDX SBOM generator
        run: python3 .github/scripts/test_generate_spdx_sbom.py
      - name: Test runtime harness safety
        run: python3 .github/scripts/test_runtime_validate.py
      - name: Verify vendored VIP SDK against pinned core
        run: |
          core_root="$RUNNER_TEMP/cs2-vip-core"
          git clone --filter=blob:none --no-checkout https://github.com/bywinsty/cs2-vip.git "$core_root"
          git -C "$core_root" fetch --depth 1 origin "$VIP_CORE_REF"
          git -C "$core_root" checkout --detach "$VIP_CORE_REF"
          test "$(git -C "$core_root" rev-parse HEAD)" = "$VIP_CORE_REF"
          python3 .github/scripts/verify_vip_sdk.py --core-root "$core_root"
      - id: manifest_contract
        name: Validate package manifest contract
        run: python3 .github/scripts/manifest_contract.py --manifest .github/package-manifest.json --github-output "$GITHUB_OUTPUT"
      - id: discover
        run: >-
          python3 .github/scripts/discover_modules.py
          --manifest .github/package-manifest.json
          --github-output "$GITHUB_OUTPUT"

  prepare-dependencies:
    runs-on: ubuntu-24.04
    outputs:
      dependency-cache-hit: ${{ steps.restore-dependencies.outputs.cache-hit }}
      pip-cache-hit: ${{ steps.restore-pip.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Initialize temporary dependency paths
        run: echo "DEPS_ROOT=$RUNNER_TEMP/vip-dependencies" >> "$GITHUB_ENV"
      - name: Prepare build tools
        id: prepare-build-tools
        uses: ./.github/actions/prepare-build-tools
      - name: Start dependency cache timer
        id: cache-restore-start
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Restore pinned dependency cache
        id: restore-dependencies
        continue-on-error: true
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ${{ runner.temp }}/vip-dependencies/ambuild
            ${{ runner.temp }}/vip-dependencies/external/metamod-source
            ${{ runner.temp }}/vip-dependencies/external/hl2sdk-cs2
            ${{ runner.temp }}/vip-dependencies/external/SchemaEntity
          key: ${{ env.CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-ubuntu24.04-${{ env.AMBUILD_REF }}-${{ env.MMS_REF }}-${{ env.HL2SDK_REF }}-${{ env.SCHEMAENTITY_REF }}-${{ env.MANIFEST_REF }}
      - name: Restore pip cache
        id: restore-pip
        continue-on-error: true
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/pip
          key: pip-${{ env.CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-ubuntu24.04-py312-${{ hashFiles('.github/ci-requirements.txt') }}
          restore-keys: |
            pip-${{ env.CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-ubuntu24.04-py312-
      - name: Finish dependency cache timer
        id: cache-restore-finish
        if: always()
        run: echo "finished_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Install CI Python dependencies
        id: install-ci-dependencies
        run: |
          start_time=$(date +%s)
          python -m pip install --require-hashes -r "$GITHUB_WORKSPACE/.github/ci-requirements.txt"
          pip_install_seconds=$(( $(date +%s) - start_time ))
          echo "pip_install_seconds=$pip_install_seconds" >> "$GITHUB_OUTPUT"
          echo "install_dependencies_seconds=$pip_install_seconds" >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare pristine pinned dependencies
        id: prepare
        if: steps.restore-dependencies.outputs.cache-hit != 'true'
        run: |
          start_time=$(date +%s)
          mkdir -p "$DEPS_ROOT/external"
          git clone --depth 1 --no-checkout https://github.com/alliedmodders/ambuild.git "$DEPS_ROOT/ambuild"
          git -C "$DEPS_ROOT/ambuild" fetch --depth 1 origin "$AMBUILD_REF"
          git -C "$DEPS_ROOT/ambuild" checkout --detach "$AMBUILD_REF"
          git clone --depth 1 --no-checkout https://github.com/alliedmodders/metamod-source.git "$DEPS_ROOT/external/metamod-source"
          git -C "$DEPS_ROOT/external/metamod-source" fetch --depth 1 origin "$MMS_REF"
          git -C "$DEPS_ROOT/external/metamod-source" checkout --detach "$MMS_REF"
          git -C "$DEPS_ROOT/external/metamod-source" submodule update --init --recursive
          git clone --depth 1 --no-checkout https://github.com/alliedmodders/hl2sdk.git "$DEPS_ROOT/external/hl2sdk-cs2"
          git -C "$DEPS_ROOT/external/hl2sdk-cs2" fetch --depth 1 origin "$HL2SDK_REF"
          git -C "$DEPS_ROOT/external/hl2sdk-cs2" checkout --detach "$HL2SDK_REF"
          git -C "$DEPS_ROOT/external/hl2sdk-cs2" submodule update --init --recursive
          schema_root="$DEPS_ROOT/external/SchemaEntity"
          git clone --depth 1 --no-checkout https://github.com/pisex/SchemaEntity.git "$schema_root"
          git -C "$schema_root" fetch --depth 1 origin "$SCHEMAENTITY_REF"
          git -C "$schema_root" checkout --detach "$SCHEMAENTITY_REF"
          test "$(git -C "$DEPS_ROOT/ambuild" rev-parse HEAD)" = "$AMBUILD_REF"
          test "$(git -C "$DEPS_ROOT/external/metamod-source" rev-parse HEAD)" = "$MMS_REF"
          test "$(git -C "$DEPS_ROOT/external/metamod-source/hl2sdk-manifests" rev-parse HEAD)" = "$MANIFEST_REF"
          test "$(git -C "$DEPS_ROOT/external/hl2sdk-cs2" rev-parse HEAD)" = "$HL2SDK_REF"
          test "$(git -C "$schema_root" rev-parse HEAD)" = "$SCHEMAENTITY_REF"
          echo "prepare_pristine_dependencies_seconds=$(( $(date +%s) - start_time ))" >> "$GITHUB_STEP_SUMMARY"
      - name: Validate cached pinned dependencies
        if: steps.restore-dependencies.outputs.cache-hit == 'true'
        run: |
          schema_root="$DEPS_ROOT/external/SchemaEntity"
          test "$(git -C "$DEPS_ROOT/ambuild" rev-parse HEAD)" = "$AMBUILD_REF"
          test "$(git -C "$DEPS_ROOT/external/metamod-source" rev-parse HEAD)" = "$MMS_REF"
          test "$(git -C "$DEPS_ROOT/external/metamod-source/hl2sdk-manifests" rev-parse HEAD)" = "$MANIFEST_REF"
          test "$(git -C "$DEPS_ROOT/external/hl2sdk-cs2" rev-parse HEAD)" = "$HL2SDK_REF"
          test "$(git -C "$schema_root" rev-parse HEAD)" = "$SCHEMAENTITY_REF"
      - name: Save pristine pinned dependency cache
        id: save-dependencies
        if: github.event_name != 'pull_request' && steps.restore-dependencies.outputs.cache-hit != 'true' && steps.prepare.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ${{ runner.temp }}/vip-dependencies/ambuild
            ${{ runner.temp }}/vip-dependencies/external/metamod-source
            ${{ runner.temp }}/vip-dependencies/external/hl2sdk-cs2
            ${{ runner.temp }}/vip-dependencies/external/SchemaEntity
          key: ${{ env.CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-ubuntu24.04-${{ env.AMBUILD_REF }}-${{ env.MMS_REF }}-${{ env.HL2SDK_REF }}-${{ env.SCHEMAENTITY_REF }}-${{ env.MANIFEST_REF }}
      - name: Install pinned AMBuild
        if: steps.restore-dependencies.outputs.cache-hit == 'true' || steps.prepare.outcome == 'success'
        run: python -m pip install "$DEPS_ROOT/ambuild"
      - name: Verify Python packaging toolchain
        run: python .github/scripts/verify_python_toolchain.py --check-ambuild
      - name: Save pip cache
        id: save-pip
        if: github.event_name != 'pull_request' && steps.restore-pip.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/pip
          key: pip-${{ env.CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-ubuntu24.04-py312-${{ hashFiles('.github/ci-requirements.txt') }}
      - name: Write dependency cache summary
        if: always()
        env:
          CACHE_RESTORE_STARTED_AT: ${{ steps.cache-restore-start.outputs.started_at }}
          CACHE_RESTORE_FINISHED_AT: ${{ steps.cache-restore-finish.outputs.finished_at }}
          SDK_CACHE_PRIMARY_KEY: ${{ steps.restore-dependencies.outputs.cache-primary-key }}
          SDK_CACHE_MATCHED_KEY: ${{ steps.restore-dependencies.outputs.cache-matched-key }}
          DEPENDENCY_CACHE_HIT: ${{ steps.restore-dependencies.outputs.cache-hit }}
          DEPENDENCY_RESTORE_OUTCOME: ${{ steps.restore-dependencies.outcome }}
          DEPENDENCY_SAVE_OUTCOME: ${{ steps.save-dependencies.outcome }}
          PIP_CACHE_PRIMARY_KEY: ${{ steps.restore-pip.outputs.cache-primary-key }}
          PIP_CACHE_MATCHED_KEY: ${{ steps.restore-pip.outputs.cache-matched-key }}
          PIP_CACHE_HIT: ${{ steps.restore-pip.outputs.cache-hit }}
          PIP_RESTORE_OUTCOME: ${{ steps.restore-pip.outcome }}
          PIP_SAVE_OUTCOME: ${{ steps.save-pip.outcome }}
          EVENT_NAME: ${{ github.event_name }}
          APT_UPDATED: ${{ steps.prepare-build-tools.outputs.apt-updated }}
          MISSING_APT_PACKAGES: ${{ steps.prepare-build-tools.outputs.missing-apt-packages }}
          PIP_INSTALL_SECONDS: ${{ steps.install-ci-dependencies.outputs.pip_install_seconds }}
          PYTHON_VERSION: ${{ steps.prepare-build-tools.outputs.python-version }}
        run: |
          cache_match_type() {
            case "${1:-}" in
              true) echo "exact" ;;
              false) echo "partial" ;;
              *) echo "miss" ;;
            esac
          }

          restore_seconds="unavailable"
          if [[ "${CACHE_RESTORE_STARTED_AT:-}" =~ ^[0-9]+$ && "${CACHE_RESTORE_FINISHED_AT:-}" =~ ^[0-9]+$ ]]; then
            restore_seconds="$((CACHE_RESTORE_FINISHED_AT - CACHE_RESTORE_STARTED_AT))"
          fi

          {
            echo "### Dependency cache"
            echo "- Event: \`$EVENT_NAME\`"
            echo "- SDK cache key: \`${{ env.CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-ubuntu24.04-${{ env.AMBUILD_REF }}-${{ env.MMS_REF }}-${{ env.HL2SDK_REF }}-${{ env.SCHEMAENTITY_REF }}-${{ env.MANIFEST_REF }}\`"
            echo "- SDK requested key: \`${SDK_CACHE_PRIMARY_KEY:-unavailable}\`"
            echo "- SDK matched key: \`${SDK_CACHE_MATCHED_KEY:-none}\`"
            echo "- SDK restore: \`$(cache_match_type \"$DEPENDENCY_CACHE_HIT\")\` (outcome: \`${DEPENDENCY_RESTORE_OUTCOME:-unknown}\`)"
            echo "- SDK save: \`${DEPENDENCY_SAVE_OUTCOME:-skipped}\`"
            echo "- pip cache key: \`pip-${{ env.CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-ubuntu24.04-py312-${{ hashFiles('.github/ci-requirements.txt') }}\`"
            echo "- pip requested key: \`${PIP_CACHE_PRIMARY_KEY:-unavailable}\`"
            echo "- pip matched key: \`${PIP_CACHE_MATCHED_KEY:-none}\`"
            echo "- pip restore: \`$(cache_match_type \"$PIP_CACHE_HIT\")\` (outcome: \`${PIP_RESTORE_OUTCOME:-unknown}\`)"
            echo "- pip save: \`${PIP_SAVE_OUTCOME:-skipped}\`"
            echo "- Restore window (SDK + pip): \`${restore_seconds}s\`"
            echo "- System setup: \`${SYSTEM_SETUP_SECONDS:-unavailable}s\`"
            echo "- apt update: \`${APT_UPDATED:-unavailable}\`"
            echo "- Missing apt packages: \`${MISSING_APT_PACKAGES:-none}\`"
            echo "- pip install: \`${PIP_INSTALL_SECONDS:-unavailable}s\`"
            echo "- Python: \`${PYTHON_VERSION:-unavailable}\`"
            echo "- Cache writes from pull requests: disabled"
            echo "- Pinned refs: AMBuild=\`$AMBUILD_REF\`, MMS=\`$MMS_REF\`, HL2SDK=\`$HL2SDK_REF\`, SchemaEntity=\`$SCHEMAENTITY_REF\`, manifest=\`$MANIFEST_REF\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Write dependency cache telemetry
        if: always()
        env:
          METRICS_JOB: prepare-dependencies
          SDK_CACHE_PRIMARY_KEY: ${{ steps.restore-dependencies.outputs.cache-primary-key }}
          SDK_CACHE_MATCHED_KEY: ${{ steps.restore-dependencies.outputs.cache-matched-key }}
          DEPENDENCY_CACHE_HIT: ${{ steps.restore-dependencies.outputs.cache-hit }}
          DEPENDENCY_RESTORE_OUTCOME: ${{ steps.restore-dependencies.outcome }}
          SDK_CACHE_SAVE_OUTCOME: ${{ steps.save-dependencies.outcome }}
          PIP_CACHE_PRIMARY_KEY: ${{ steps.restore-pip.outputs.cache-primary-key }}
          PIP_CACHE_MATCHED_KEY: ${{ steps.restore-pip.outputs.cache-matched-key }}
          PIP_CACHE_HIT: ${{ steps.restore-pip.outputs.cache-hit }}
          PIP_RESTORE_OUTCOME: ${{ steps.restore-pip.outcome }}
          PIP_CACHE_SAVE_OUTCOME: ${{ steps.save-pip.outcome }}
          CACHE_RESTORE_STARTED_AT: ${{ steps.cache-restore-start.outputs.started_at }}
          CACHE_RESTORE_FINISHED_AT: ${{ steps.cache-restore-finish.outputs.finished_at }}
          APT_UPDATED: ${{ steps.prepare-build-tools.outputs.apt-updated }}
          MISSING_APT_PACKAGES: ${{ steps.prepare-build-tools.outputs.missing-apt-packages }}
          PIP_INSTALL_SECONDS: ${{ steps.install-ci-dependencies.outputs.pip_install_seconds }}
          PYTHON_VERSION: ${{ steps.prepare-build-tools.outputs.python-version }}
        run: |
          python .github/scripts/cache_metrics.py record \
            --job "$METRICS_JOB" \
            --output "cache-metrics/${METRICS_JOB}.json"
      - name: Upload dependency cache telemetry
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cache-metrics-prepare-dependencies
          path: cache-metrics/prepare-dependencies.json
          archive: true
          if-no-files-found: warn
          retention-days: 30

  build-module:
    needs: [discover, prepare-dependencies]
    if: ${{ needs.discover.result == 'success' && needs.prepare-dependencies.result == 'success' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.modules) }}
    env:
      MODULE_DIR: ${{ matrix.module_dir }}
      BUILD_ROOT: ${{ matrix.build_root }}
      PLUGIN_NAME: ${{ matrix.plugin_name }}
      PLUGIN_ALIAS: ${{ matrix.plugin_alias }}
      PACKAGE_DIR: vip_modules
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Initialize temporary dependency paths
        run: |
          echo "DEPS_ROOT=$RUNNER_TEMP/vip-dependencies" >> "$GITHUB_ENV"
          echo "MANIFEST_PATH=$RUNNER_TEMP/hl2sdk-manifests" >> "$GITHUB_ENV"
      - name: Prepare build tools
        id: prepare-build-tools
        uses: ./.github/actions/prepare-build-tools
      - name: Start dependency cache timer
        id: cache-restore-start
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Restore pinned dependency cache
        id: restore-dependencies
        continue-on-error: true
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ${{ runner.temp }}/vip-dependencies/ambuild
            ${{ runner.temp }}/vip-dependencies/external/metamod-source
            ${{ runner.temp }}/vip-dependencies/external/hl2sdk-cs2
            ${{ runner.temp }}/vip-dependencies/external/SchemaEntity
          key: ${{ env.CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-ubuntu24.04-${{ env.AMBUILD_REF }}-${{ env.MMS_REF }}-${{ env.HL2SDK_REF }}-${{ env.SCHEMAENTITY_REF }}-${{ env.MANIFEST_REF }}
      - name: Restore pip cache
        id: restore-pip
        continue-on-error: true
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/pip
          key: pip-${{ env.CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-ubuntu24.04-py312-${{ hashFiles('.github/ci-requirements.txt') }}
          restore-keys: |
            pip-${{ env.CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-ubuntu24.04-py312-
      - name: Finish dependency cache timer
        id: cache-restore-finish
        if: always()
        run: echo "finished_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Install CI Python dependencies
        id: install-ci-dependencies
        run: |
          start_time=$(date +%s)
          python -m pip install --require-hashes -r "$GITHUB_WORKSPACE/.github/ci-requirements.txt"
          pip_install_seconds=$(( $(date +%s) - start_time ))
          echo "pip_install_seconds=$pip_install_seconds" >> "$GITHUB_OUTPUT"
      - name: Restore or checkout pinned dependencies
        id: checkout-pinned-dependencies
        env:
          DEPENDENCY_CACHE_HIT: ${{ steps.restore-dependencies.outputs.cache-hit }}
        run: |
          start_time=$(date +%s)
          mkdir -p "$DEPS_ROOT/external"
          if [[ "$DEPENDENCY_CACHE_HIT" != "true" ]]; then
            git clone --depth 1 --no-checkout https://github.com/alliedmodders/ambuild.git "$DEPS_ROOT/ambuild"
            git -C "$DEPS_ROOT/ambuild" fetch --depth 1 origin "$AMBUILD_REF"
            git -C "$DEPS_ROOT/ambuild" checkout --detach "$AMBUILD_REF"
            git clone --depth 1 --no-checkout https://github.com/alliedmodders/metamod-source.git "$DEPS_ROOT/external/metamod-source"
            git -C "$DEPS_ROOT/external/metamod-source" fetch --depth 1 origin "$MMS_REF"
            git -C "$DEPS_ROOT/external/metamod-source" checkout --detach "$MMS_REF"
            git -C "$DEPS_ROOT/external/metamod-source" submodule update --init --recursive
            git clone --depth 1 --no-checkout https://github.com/alliedmodders/hl2sdk.git "$DEPS_ROOT/external/hl2sdk-cs2"
            git -C "$DEPS_ROOT/external/hl2sdk-cs2" fetch --depth 1 origin "$HL2SDK_REF"
            git -C "$DEPS_ROOT/external/hl2sdk-cs2" checkout --detach "$HL2SDK_REF"
            git -C "$DEPS_ROOT/external/hl2sdk-cs2" submodule update --init --recursive
            schema_root="$DEPS_ROOT/external/SchemaEntity"
            git clone --depth 1 --no-checkout https://github.com/pisex/SchemaEntity.git "$schema_root"
            git -C "$schema_root" fetch --depth 1 origin "$SCHEMAENTITY_REF"
            git -C "$schema_root" checkout --detach "$SCHEMAENTITY_REF"
            echo "fallback-used=true" >> "$GITHUB_OUTPUT"
          else
            echo "fallback-used=false" >> "$GITHUB_OUTPUT"
          fi
          schema_root="$DEPS_ROOT/external/SchemaEntity"
          python -m pip install "$DEPS_ROOT/ambuild"
          python .github/scripts/verify_python_toolchain.py --check-ambuild
          rm -rf "$MANIFEST_PATH"
          mkdir -p "$MANIFEST_PATH"
          cp -R "$DEPS_ROOT/external/metamod-source/hl2sdk-manifests/." "$MANIFEST_PATH/"
          test "$(git -C "$DEPS_ROOT/ambuild" rev-parse HEAD)" = "$AMBUILD_REF"
          test "$(git -C "$DEPS_ROOT/external/metamod-source" rev-parse HEAD)" = "$MMS_REF"
          test "$(git -C "$DEPS_ROOT/external/metamod-source/hl2sdk-manifests" rev-parse HEAD)" = "$MANIFEST_REF"
          test "$(git -C "$DEPS_ROOT/external/hl2sdk-cs2" rev-parse HEAD)" = "$HL2SDK_REF"
          test "$(git -C "$schema_root" rev-parse HEAD)" = "$SCHEMAENTITY_REF"
          echo "pinned_dependencies_seconds=$(( $(date +%s) - start_time ))" >> "$GITHUB_STEP_SUMMARY"
      - name: Write dependency cache summary
        if: always()
        env:
          CACHE_RESTORE_STARTED_AT: ${{ steps.cache-restore-start.outputs.started_at }}
          CACHE_RESTORE_FINISHED_AT: ${{ steps.cache-restore-finish.outputs.finished_at }}
          SDK_CACHE_PRIMARY_KEY: ${{ steps.restore-dependencies.outputs.cache-primary-key }}
          SDK_CACHE_MATCHED_KEY: ${{ steps.restore-dependencies.outputs.cache-matched-key }}
          DEPENDENCY_CACHE_HIT: ${{ steps.restore-dependencies.outputs.cache-hit }}
          DEPENDENCY_RESTORE_OUTCOME: ${{ steps.restore-dependencies.outcome }}
          PIP_CACHE_PRIMARY_KEY: ${{ steps.restore-pip.outputs.cache-primary-key }}
          PIP_CACHE_MATCHED_KEY: ${{ steps.restore-pip.outputs.cache-matched-key }}
          PIP_CACHE_HIT: ${{ steps.restore-pip.outputs.cache-hit }}
          PIP_RESTORE_OUTCOME: ${{ steps.restore-pip.outcome }}
          FALLBACK_USED: ${{ steps.checkout-pinned-dependencies.outputs.fallback-used }}
          APT_UPDATED: ${{ steps.prepare-build-tools.outputs.apt-updated }}
          MISSING_APT_PACKAGES: ${{ steps.prepare-build-tools.outputs.missing-apt-packages }}
          PIP_INSTALL_SECONDS: ${{ steps.install-ci-dependencies.outputs.pip_install_seconds }}
          PYTHON_VERSION: ${{ steps.prepare-build-tools.outputs.python-version }}
        run: |
          cache_match_type() {
            case "${1:-}" in
              true) echo "exact" ;;
              false) echo "partial" ;;
              *) echo "miss" ;;
            esac
          }

          restore_seconds="unavailable"
          if [[ "${CACHE_RESTORE_STARTED_AT:-}" =~ ^[0-9]+$ && "${CACHE_RESTORE_FINISHED_AT:-}" =~ ^[0-9]+$ ]]; then
            restore_seconds="$((CACHE_RESTORE_FINISHED_AT - CACHE_RESTORE_STARTED_AT))"
          fi

          {
            echo "### Dependency cache"
            echo "- SDK cache key: \`${{ env.CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-ubuntu24.04-${{ env.AMBUILD_REF }}-${{ env.MMS_REF }}-${{ env.HL2SDK_REF }}-${{ env.SCHEMAENTITY_REF }}-${{ env.MANIFEST_REF }}\`"
            echo "- SDK requested key: \`${SDK_CACHE_PRIMARY_KEY:-unavailable}\`"
            echo "- SDK matched key: \`${SDK_CACHE_MATCHED_KEY:-none}\`"
            echo "- SDK restore: \`$(cache_match_type \"$DEPENDENCY_CACHE_HIT\")\` (outcome: \`${DEPENDENCY_RESTORE_OUTCOME:-unknown}\`)"
            echo "- pip cache key: \`pip-${{ env.CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-ubuntu24.04-py312-${{ hashFiles('.github/ci-requirements.txt') }}\`"
            echo "- pip requested key: \`${PIP_CACHE_PRIMARY_KEY:-unavailable}\`"
            echo "- pip matched key: \`${PIP_CACHE_MATCHED_KEY:-none}\`"
            echo "- pip restore: \`$(cache_match_type \"$PIP_CACHE_HIT\")\` (outcome: \`${PIP_RESTORE_OUTCOME:-unknown}\`)"
            echo "- Restore window (SDK + pip): \`${restore_seconds}s\`"
            echo "- System setup: \`${SYSTEM_SETUP_SECONDS:-unavailable}s\`"
            echo "- apt update: \`${APT_UPDATED:-unavailable}\`"
            echo "- Missing apt packages: \`${MISSING_APT_PACKAGES:-none}\`"
            echo "- pip install: \`${PIP_INSTALL_SECONDS:-unavailable}s\`"
            echo "- Python: \`${PYTHON_VERSION:-unavailable}\`"
            echo "- Fallback clone used: \`${FALLBACK_USED:-unknown}\`"
            echo "- Pinned refs: AMBuild=\`$AMBUILD_REF\`, MMS=\`$MMS_REF\`, HL2SDK=\`$HL2SDK_REF\`, SchemaEntity=\`$SCHEMAENTITY_REF\`, manifest=\`$MANIFEST_REF\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Write dependency cache telemetry
        if: always()
        env:
          METRICS_JOB: ${{ matrix.module }}
          SDK_CACHE_PRIMARY_KEY: ${{ steps.restore-dependencies.outputs.cache-primary-key }}
          SDK_CACHE_MATCHED_KEY: ${{ steps.restore-dependencies.outputs.cache-matched-key }}
          DEPENDENCY_CACHE_HIT: ${{ steps.restore-dependencies.outputs.cache-hit }}
          DEPENDENCY_RESTORE_OUTCOME: ${{ steps.restore-dependencies.outcome }}
          PIP_CACHE_PRIMARY_KEY: ${{ steps.restore-pip.outputs.cache-primary-key }}
          PIP_CACHE_MATCHED_KEY: ${{ steps.restore-pip.outputs.cache-matched-key }}
          PIP_CACHE_HIT: ${{ steps.restore-pip.outputs.cache-hit }}
          PIP_RESTORE_OUTCOME: ${{ steps.restore-pip.outcome }}
          FALLBACK_USED: ${{ steps.checkout-pinned-dependencies.outputs.fallback-used }}
          CACHE_RESTORE_STARTED_AT: ${{ steps.cache-restore-start.outputs.started_at }}
          CACHE_RESTORE_FINISHED_AT: ${{ steps.cache-restore-finish.outputs.finished_at }}
          APT_UPDATED: ${{ steps.prepare-build-tools.outputs.apt-updated }}
          MISSING_APT_PACKAGES: ${{ steps.prepare-build-tools.outputs.missing-apt-packages }}
          PIP_INSTALL_SECONDS: ${{ steps.install-ci-dependencies.outputs.pip_install_seconds }}
          PYTHON_VERSION: ${{ steps.prepare-build-tools.outputs.python-version }}
        run: |
          python .github/scripts/cache_metrics.py record \
            --job "$METRICS_JOB" \
            --output "cache-metrics/${METRICS_JOB}.json"
      - name: Upload module cache telemetry
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cache-metrics-${{ matrix.module }}
          path: cache-metrics/${{ matrix.module }}.json
          archive: true
          if-no-files-found: warn
          retention-days: 30

      - name: Prepare compatibility patches
        run: |
          schema_root="$DEPS_ROOT/external/SchemaEntity"
          python .github/scripts/apply_sdk_compatibility_patches.py \
            --sdk-root "$DEPS_ROOT/external/hl2sdk-cs2" \
            --manifest-path "$MANIFEST_PATH/manifests/cs2.json" \
            --schema-root "$schema_root" \
            --require-include public/game/server
          test -f "$MANIFEST_PATH/SdkHelpers.ambuild"
          test -f "$MANIFEST_PATH/manifests/cs2.json"
          test ! -f "$DEPS_ROOT/external/hl2sdk-cs2/tier1/generichash.cpp"
          ! grep -q "tier1', 'generichash.cpp" "$GITHUB_WORKSPACE/$BUILD_ROOT/AMBuildScript"

      - name: Set reproducible build epoch
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"
      - name: Configure and build
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          start_time=$(date +%s)
          rm -rf "$GITHUB_WORKSPACE/$BUILD_ROOT/build"
          mkdir -p "$GITHUB_WORKSPACE/$BUILD_ROOT/build"
          cd "$GITHUB_WORKSPACE/$BUILD_ROOT/build"
          python ../configure.py \
            --sdks cs2 \
            --targets x86_64 \
            --enable-optimize \
            --disable-debug \
            --plugin-name "$PLUGIN_NAME" \
            --plugin-alias "$PLUGIN_ALIAS" \
            --hl2sdk-manifests="$MANIFEST_PATH" \
            --mms_path="$DEPS_ROOT/external/metamod-source" \
            --hl2sdk-root="$DEPS_ROOT/external" \
            --schemaentity-root="$DEPS_ROOT/external/SchemaEntity" \
            --vip-sdk-root="$GITHUB_WORKSPACE/include"
          ambuild
          echo "configure_build_seconds=$(( $(date +%s) - start_time ))" >> "$GITHUB_STEP_SUMMARY"
      - name: Validate package and create archive
        run: |
          package_root="$GITHUB_WORKSPACE/$BUILD_ROOT/build/package"
          python "$GITHUB_WORKSPACE/.github/scripts/validate_package.py" \
            --manifest "$GITHUB_WORKSPACE/.github/package-manifest.json" \
            --package-root "$package_root" \
            --package-key "${{ matrix.module }}"
          archive="$RUNNER_TEMP/${{ matrix.module }}.tar.gz"
          python "$GITHUB_WORKSPACE/.github/scripts/create_reproducible_archive.py" \
            --root "$package_root" \
            --output "$archive" \
            --format tar.gz
          python "$GITHUB_WORKSPACE/.github/scripts/validate_package.py" \
            --manifest "$GITHUB_WORKSPACE/.github/package-manifest.json" \
            --package-key "${{ matrix.module }}" \
            --archive "$archive" \
            --archive-format tar.gz
          python "$GITHUB_WORKSPACE/.github/scripts/check_binary_smoke.py" \
            --manifest "$GITHUB_WORKSPACE/.github/package-manifest.json" \
            --package-key "${{ matrix.module }}" \
            --package-root "$package_root"
          python "$GITHUB_WORKSPACE/.github/scripts/verify_elf_hardening.py" \
            "$package_root/${{ matrix.binary }}" \
            --library-path "$DEPS_ROOT/external/hl2sdk-cs2/lib/linux64"
          test -s "$archive"

      - name: Rebuild representative module and compare digests
        if: matrix.module == 'VIP_Test'
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          repro_root="$GITHUB_WORKSPACE/$BUILD_ROOT/build-repro"
          rm -rf "$repro_root"
          mkdir -p "$repro_root"
          cd "$repro_root"
          python ../configure.py \
            --sdks cs2 \
            --targets x86_64 \
            --enable-optimize \
            --disable-debug \
            --plugin-name "$PLUGIN_NAME" \
            --plugin-alias "$PLUGIN_ALIAS" \
            --hl2sdk-manifests="$MANIFEST_PATH" \
            --mms_path="$DEPS_ROOT/external/metamod-source" \
            --hl2sdk-root="$DEPS_ROOT/external" \
            --schemaentity-root="$DEPS_ROOT/external/SchemaEntity" \
            --vip-sdk-root="$GITHUB_WORKSPACE/include"
          ambuild
          cd "$GITHUB_WORKSPACE"
          cmp \
            "$GITHUB_WORKSPACE/$BUILD_ROOT/build/package/${{ matrix.binary }}" \
            "$repro_root/package/${{ matrix.binary }}"
          python .github/scripts/create_reproducible_archive.py \
            --root "$repro_root/package" \
            --output "$RUNNER_TEMP/${{ matrix.module }}-repro.tar.gz" \
            --format tar.gz
          cmp \
            "$RUNNER_TEMP/${{ matrix.module }}.tar.gz" \
            "$RUNNER_TEMP/${{ matrix.module }}-repro.tar.gz"

      - name: Verify build left checkout clean
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Upload module archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.module }}.tar.gz
          path: ${{ runner.temp }}/${{ matrix.module }}.tar.gz
          archive: true
          if-no-files-found: error
          retention-days: 30

  package-release:
    name: Package release artifacts
    needs: [discover, build-module]
    if: ${{ needs.discover.result == 'success' && needs.build-module.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set reproducible archive epoch
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"

      - name: Install packaging tools
        run: |
          sudo apt-get update -qy
          sudo apt-get install -y tar zip unzip

      - name: Download module archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: VIP_*.tar.gz
          path: module-archives
          merge-multiple: true

      - name: Verify downloaded module archives
        env:
          EXPECTED_MODULE_COUNT: ${{ needs.discover.outputs.module_count }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path(".github/package-manifest.json").read_text(encoding="utf-8"))
          expected = {f"{module}.tar.gz" for module in manifest["packages"]}
          archive_dir = Path("module-archives")
          actual = {path.name for path in archive_dir.glob("VIP_*.tar.gz")}
          old_names = list(archive_dir.glob("vip-module-*"))
          if actual != expected:
              raise SystemExit(f"Unexpected module archives: missing={sorted(expected - actual)}, extra={sorted(actual)}")
          if old_names:
              raise SystemExit(f"Old artifact names found: {[path.name for path in old_names]}")
          if len(actual) != int(os.environ["EXPECTED_MODULE_COUNT"]):
              raise SystemExit(
                  f"Expected {os.environ['EXPECTED_MODULE_COUNT']} module archives, found {len(actual)}"
              )
          PY

      - name: Build combined archive
        run: |
          rm -rf combined-root release info
          mkdir -p combined-root release info
          cp module-archives/VIP_*.tar.gz release/
          python3 .github/scripts/create_reproducible_archive.py \
            --root module-archives \
            --output release/Modules.tar.gz \
            --format tar.gz
          test -s release/Modules.tar.gz
          for archive in module-archives/VIP_*.tar.gz; do
            tar -xzf "$archive" -C combined-root
          done
          test -d combined-root/addons
          cp release/Modules.tar.gz combined-root/Modules.tar.gz
          python3 .github/scripts/create_reproducible_archive.py \
            --root combined-root \
            --output release/VIP_All_Modules.tar.gz \
            --format tar.gz
          python3 .github/scripts/create_reproducible_archive.py \
            --root combined-root \
            --output release/VIP_All_Modules.repro.tar.gz \
            --format tar.gz
          cmp release/VIP_All_Modules.tar.gz release/VIP_All_Modules.repro.tar.gz
          rm release/VIP_All_Modules.repro.tar.gz
          cp release/VIP_All_Modules.tar.gz release/VIP_Modules.tar.gz
          cmp --silent release/VIP_All_Modules.tar.gz release/VIP_Modules.tar.gz

      - name: Validate combined archive
        env:
          EXPECTED_PACKAGE_FILE_COUNT: ${{ needs.discover.outputs.package_file_count }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import posixpath
          import tarfile
          from pathlib import Path

          manifest = json.loads(Path(".github/package-manifest.json").read_text(encoding="utf-8"))
          expected_addons = {
              path
              for package in manifest["packages"].values()
              for path in package["files"]
          }
          expected_module_archives = {
              f"{module}.tar.gz" for module in manifest["packages"]
          }
          expected = expected_addons | {"Modules.tar.gz"}
          if len(expected_addons) != int(os.environ["EXPECTED_PACKAGE_FILE_COUNT"]):
              raise SystemExit(
                  f"Expected {os.environ['EXPECTED_PACKAGE_FILE_COUNT']} unique manifest files, found {len(expected_addons)}"
              )

          def normalized(name):
              name = name.replace("\\", "/")
              if "\x00" in name or name.startswith("/"):
                  raise SystemExit(f"Unsafe archive path: {name!r}")
              parts = name.rstrip("/").split("/")
              if ".." in parts:
                  raise SystemExit(f"Unsafe archive path: {name!r}")
              result = posixpath.normpath(name)
              if result in ("", ".", "..") or result.startswith("../"):
                  raise SystemExit(f"Unsafe archive path: {name!r}")
              return result

          def validate_members(handle, expected_files, expected_directories, label):
              files = set()
              directories = set()
              seen = set()
              for member in handle.getmembers():
                  name = normalized(member.name)
                  if name in seen:
                      raise SystemExit(f"Duplicate {label} member: {name}")
                  seen.add(name)
                  if member.isdir():
                      directories.add(name)
                      continue
                  if member.issym() or member.islnk():
                      raise SystemExit(f"Links are not allowed in {label}: {name}")
                  if not member.isfile():
                      raise SystemExit(f"Unsupported {label} member type: {name}")
                  if member.size == 0:
                      raise SystemExit(f"Empty {label} member: {name}")
                  files.add(name)
              if files != expected_files:
                  raise SystemExit(
                      f"{label} file mismatch; missing={sorted(expected_files - files)}, "
                      f"extra={sorted(files - expected_files)}"
                  )
              if directories != expected_directories:
                  raise SystemExit(
                      f"{label} directory mismatch; missing={sorted(expected_directories - directories)}, "
                      f"extra={sorted(directories - expected_directories)}"
                  )

          expected_directories = {
              "/".join(path.split("/")[:index])
              for path in expected_addons
              for index in range(1, len(path.split("/")))
          }
          with tarfile.open("release/VIP_All_Modules.tar.gz", "r:gz") as archive:
              validate_members(archive, expected, expected_directories, "combined archive")
              modules_member = archive.getmember("Modules.tar.gz")
              with tarfile.open(fileobj=archive.extractfile(modules_member), mode="r:gz") as modules_archive:
                  validate_members(modules_archive, expected_module_archives, set(), "Modules.tar.gz")
          print(f"Validated {len(expected_addons)} package files and {len(expected_module_archives)} module archives")
          PY

      - name: Generate and verify combined SPDX SBOM
        run: |
          python3 .github/scripts/generate_spdx_sbom.py \
            --name cs2-vip-modules \
            --version "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --archive release/VIP_All_Modules.tar.gz \
            --root combined-root \
            --requirements .github/ci-requirements.txt \
            --git-dependency "VIP-Core=https://github.com/bywinsty/cs2-vip#$VIP_CORE_REF" \
            --git-dependency "AMBuild=https://github.com/alliedmodders/ambuild#$AMBUILD_REF" \
            --git-dependency "Metamod-Source=https://github.com/alliedmodders/metamod-source#$MMS_REF" \
            --git-dependency "HL2SDK-CS2=https://github.com/alliedmodders/hl2sdk#$HL2SDK_REF" \
            --git-dependency "HL2SDK-Manifests=https://github.com/alliedmodders/hl2sdk-manifests#$MANIFEST_REF" \
            --git-dependency "SchemaEntity=https://github.com/pisex/SchemaEntity#$SCHEMAENTITY_REF" \
            --output release/VIP_All_Modules.spdx.json
          python3 .github/scripts/verify_spdx_subject.py \
            --archive release/VIP_All_Modules.tar.gz \
            --sbom release/VIP_All_Modules.spdx.json
          python3 .github/scripts/generate_spdx_sbom.py \
            --name cs2-vip-modules \
            --version "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --archive release/VIP_All_Modules.tar.gz \
            --root combined-root \
            --requirements .github/ci-requirements.txt \
            --git-dependency "VIP-Core=https://github.com/bywinsty/cs2-vip#$VIP_CORE_REF" \
            --git-dependency "AMBuild=https://github.com/alliedmodders/ambuild#$AMBUILD_REF" \
            --git-dependency "Metamod-Source=https://github.com/alliedmodders/metamod-source#$MMS_REF" \
            --git-dependency "HL2SDK-CS2=https://github.com/alliedmodders/hl2sdk#$HL2SDK_REF" \
            --git-dependency "HL2SDK-Manifests=https://github.com/alliedmodders/hl2sdk-manifests#$MANIFEST_REF" \
            --git-dependency "SchemaEntity=https://github.com/pisex/SchemaEntity#$SCHEMAENTITY_REF" \
            --output release/VIP_All_Modules.repro.spdx.json
          cmp release/VIP_All_Modules.spdx.json release/VIP_All_Modules.repro.spdx.json
          rm release/VIP_All_Modules.repro.spdx.json

      - name: Create build reports
        env:
          MODULES_JSON: ${{ needs.discover.outputs.modules }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          entries = json.loads(os.environ["MODULES_JSON"])
          commit = os.environ["COMMIT_SHA"]
          manifest = json.loads(Path(".github/package-manifest.json").read_text(encoding="utf-8"))
          modules = {entry["module"] for entry in entries}
          if modules != set(manifest["packages"]):
              raise SystemExit("Discovery output does not match package manifest")
          info = Path("info")
          for entry in sorted(entries, key=lambda item: item["module"]):
              module = entry["module"]
              report = info / f"{module}-BUILD_REPORT.md"
              report.write_text(
                  f"module={module}\n"
                  f"build_root={entry['build_root']}\n"
                  f"commit={commit}\n"
                  "arch=x86_64\n",
                  encoding="utf-8",
              )
          PY

      - name: Create checksums and metadata archive
        env:
          EXPECTED_RELEASE_ARCHIVE_COUNT: ${{ needs.discover.outputs.release_archive_count }}
        run: |
          tarball_count="$(find release -maxdepth 1 -type f -name 'VIP_*.tar.gz' | wc -l)"
          test "$tarball_count" -eq "$EXPECTED_RELEASE_ARCHIVE_COUNT"
          (
            cd release
            for archive in $(printf "%s\n" VIP_*.tar.gz | sort); do
              sha256sum "$archive"
            done
          ) > info/SHA256SUMS
          test "$(wc -l < info/SHA256SUMS)" -eq "$EXPECTED_RELEASE_ARCHIVE_COUNT"
          python3 .github/scripts/create_reproducible_archive.py \
            --root info \
            --output release/Modules_Build_Info.zip \
            --format zip

      - name: Validate metadata archive
        env:
          EXPECTED_RELEASE_ARCHIVE_COUNT: ${{ needs.discover.outputs.release_archive_count }}
          EXPECTED_REPORT_COUNT: ${{ needs.discover.outputs.report_count }}
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import zipfile
          from pathlib import Path

          release = Path("release")
          info = Path("info")
          expected_archives = sorted(path.name for path in release.glob("VIP_*.tar.gz"))
          expected_reports = {
              f"{path.name.removesuffix('.tar.gz')}-BUILD_REPORT.md"
              for path in release.glob("VIP_*.tar.gz")
              if path.name not in {"VIP_All_Modules.tar.gz", "VIP_Modules.tar.gz"}
          }
          expected = {"SHA256SUMS"} | expected_reports
          if len(expected_archives) != int(os.environ["EXPECTED_RELEASE_ARCHIVE_COUNT"]):
              raise SystemExit(
                  f"Expected {os.environ['EXPECTED_RELEASE_ARCHIVE_COUNT']} release archives, found {len(expected_archives)}"
              )
          if len(expected_reports) != int(os.environ["EXPECTED_REPORT_COUNT"]):
              raise SystemExit(
                  f"Expected {os.environ['EXPECTED_REPORT_COUNT']} reports, found {len(expected_reports)}"
              )

          with zipfile.ZipFile(release / "Modules_Build_Info.zip") as archive:
              names = archive.namelist()
          if len(names) != len(expected) or set(names) != expected:
              raise SystemExit(f"Unexpected metadata files: {sorted(names)}")

          lines = (info / "SHA256SUMS").read_text(encoding="utf-8").splitlines()
          if len(lines) != len(expected_archives):
              raise SystemExit(
                  f"Expected {len(expected_archives)} checksum lines, found {len(lines)}"
              )
          checksums = {}
          for line in lines:
              digest, filename = line.split(maxsplit=1)
              if filename in checksums:
                  raise SystemExit(f"Duplicate checksum entry: {filename}")
              checksums[filename] = digest
              actual = hashlib.sha256((release / filename).read_bytes()).hexdigest()
              if digest != actual:
                  raise SystemExit(f"Checksum mismatch: {filename}")
          if list(checksums) != expected_archives:
              raise SystemExit("SHA256SUMS is not sorted or does not cover all archives")
          print("Validated metadata archive and SHA256SUMS")
          PY

      - name: Verify packaging left checkout clean
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Upload combined module archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: VIP_All_Modules.tar.gz
          path: release/VIP_All_Modules.tar.gz
          archive: true
          if-no-files-found: error
          retention-days: 30

      - name: Upload legacy combined module archive alias
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: VIP_Modules.tar.gz
          path: release/VIP_Modules.tar.gz
          archive: true
          if-no-files-found: error
          retention-days: 30

      - name: Upload combined SPDX SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: VIP_All_Modules.spdx.json
          path: release/VIP_All_Modules.spdx.json
          archive: true
          if-no-files-found: error
          retention-days: 30

      - name: Upload build information
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Modules_Build_Info.zip
          path: release/Modules_Build_Info.zip
          archive: true
          if-no-files-found: error
          retention-days: 30
  build-summary:
    needs: [discover, prepare-dependencies, build-module, package-release]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download cache telemetry
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: cache-metrics-*
          path: cache-metrics
          merge-multiple: true

      - name: Aggregate cache telemetry
        if: always()
        continue-on-error: true
        env:
          EXPECTED_MODULES_JSON: ${{ needs.discover.outputs.modules }}
        run: |
          python3 .github/scripts/cache_metrics.py aggregate \
            --input-dir cache-metrics \
            --output-json cache-metrics-summary.json \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Upload aggregate cache telemetry
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cache-metrics-summary
          path: cache-metrics-summary.json
          archive: true
          if-no-files-found: warn
          retention-days: 30

      - name: Verify build results
        env:
          DISCOVER_RESULT: ${{ needs.discover.result }}
          PREPARE_RESULT: ${{ needs.prepare-dependencies.result }}
          BUILD_RESULT: ${{ needs.build-module.result }}
          PACKAGE_RESULT: ${{ needs.package-release.result }}
        run: |
          test "$DISCOVER_RESULT" = success
          test "$PREPARE_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$PACKAGE_RESULT" = success
          echo "All module builds and packaging passed."
  create-release:
    name: Update GitHub release
    needs: [discover, build-summary]
    if: >-
      ${{
        github.event_name == 'push' &&
        (
          github.ref_name == 'dev' ||
          (
            github.ref_name == 'Modules' &&
            vars.RUNTIME_VALIDATION_SHA == github.sha &&
            vars.RUNTIME_VALIDATION_REPORT_URL != ''
          )
        ) &&
        needs.discover.result == 'success' &&
        needs.build-summary.result == 'success'
      }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name == 'Modules' && '1.0-bywinsty' || 'dev' }}
      RELEASE_TITLE: ${{ github.ref_name == 'Modules' && '1.0-bywinsty' || 'dev' }}
      IS_PRERELEASE: ${{ github.ref_name == 'dev' }}
      RUNTIME_VALIDATION_REPORT_URL: ${{ vars.RUNTIME_VALIDATION_REPORT_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download release tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: VIP_*.tar.gz
          path: release-assets
          merge-multiple: true

      - name: Download combined SPDX SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: VIP_All_Modules.spdx.json
          path: release-assets

      - name: Validate release inputs
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path(".github/package-manifest.json").read_text(encoding="utf-8"))
          expected = {f"{module}.tar.gz" for module in manifest["packages"]}
          expected.add("VIP_All_Modules.tar.gz")
          expected.add("VIP_Modules.tar.gz")
          actual = {path.name for path in Path("release-assets").glob("VIP_*.tar.gz")}
          if actual != expected:
              raise SystemExit(
                  f"Unexpected release inputs: missing={sorted(expected - actual)}, extra={sorted(actual)}"
              )
          if len(actual) != 37:
              raise SystemExit(f"Expected 37 tar.gz assets, found {len(actual)}")
          if Path("release-assets/Modules_Build_Info.zip").exists():
              raise SystemExit("Modules_Build_Info.zip must not be a release input")
          sbom = Path("release-assets/VIP_All_Modules.spdx.json")
          if not sbom.is_file():
              raise SystemExit("VIP_All_Modules.spdx.json is missing")
          print("Validated 35 module archives and both combined archive names")
          PY
          python3 .github/scripts/verify_spdx_subject.py \
            --archive release-assets/VIP_All_Modules.tar.gz \
            --sbom release-assets/VIP_All_Modules.spdx.json

      - name: Check current branch tip
        id: branch-tip
        run: |
          current_tip="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha')"
          if [[ "$current_tip" != "$GITHUB_SHA" ]]; then
            echo "Skipping stale run: $GITHUB_REF_NAME tip is $current_tip, workflow SHA is $GITHUB_SHA"
            echo "stale=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "stale=false" >> "$GITHUB_OUTPUT"

      - name: Move release tag
        if: steps.branch-tip.outputs.stale != 'true'
        run: |
          tag_ref="repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG"
          if gh api "$tag_ref" >/dev/null 2>&1; then
            gh api --method PATCH "$tag_ref" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs"               -f ref="refs/tags/$RELEASE_TAG"               -f sha="$GITHUB_SHA" >/dev/null
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$GITHUB_SHA"

      - name: Attest release archive provenance
        if: steps.branch-tip.outputs.stale != 'true'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: release-assets/*.tar.gz

      - name: Attest combined archive SBOM
        if: steps.branch-tip.outputs.stale != 'true'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: release-assets/VIP_All_Modules.tar.gz
          sbom-path: release-assets/VIP_All_Modules.spdx.json

      - name: Attest SPDX document provenance
        if: steps.branch-tip.outputs.stale != 'true'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: release-assets/VIP_All_Modules.spdx.json

      - name: Create or update release
        if: steps.branch-tip.outputs.stale != 'true'
        run: |
          notes=$'Automated release from '"$GITHUB_REF_NAME"$'.\n\nCommit: '"$GITHUB_SHA"$'\nWorkflow run: https://github.com/'"$GITHUB_REPOSITORY"'/actions/runs/'"$GITHUB_RUN_ID"
          if [[ "$IS_PRERELEASE" != "true" ]]; then
            notes+=$'\nRuntime validation: '"$RUNTIME_VALIDATION_REPORT_URL"
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes "$notes" \
              --draft=false \
              --prerelease="$IS_PRERELEASE"
          else
            create_args=(
              "$RELEASE_TAG"
              --repo "$GITHUB_REPOSITORY"
              --target "$GITHUB_SHA"
              --title "$RELEASE_TITLE"
              --notes "$notes"
            )
            if [[ "$IS_PRERELEASE" == "true" ]]; then
              create_args+=(--prerelease)
            fi
            gh release create "${create_args[@]}"
          fi

      - name: Upload release assets
        if: steps.branch-tip.outputs.stale != 'true'
        run: |
          for asset in release-assets/*.tar.gz; do
            gh release upload "$RELEASE_TAG" "$asset"               --repo "$GITHUB_REPOSITORY"               --clobber
          done
          gh release upload "$RELEASE_TAG" release-assets/VIP_All_Modules.spdx.json \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Verify release assets
        if: steps.branch-tip.outputs.stale != 'true'
        run: |
          mapfile -t expected < <(find release-assets -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.spdx.json' \) -printf '%f\n' | sort)
          mapfile -t actual < <(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort)
          if [[ "${expected[*]}" != "${actual[*]}" ]]; then
            echo "Expected release assets:"
            printf '%s\n' "${expected[@]}"
            echo "Actual release assets:"
            printf '%s\n' "${actual[@]}"
            exit 1
          fi
          if printf '%s\n' "${actual[@]}" | grep -Fxq 'Modules_Build_Info.zip'; then
            echo "Modules_Build_Info.zip must not be published"
            exit 1
          fi
          test "${#actual[@]}" -eq 38
          gh attestation verify release-assets/VIP_All_Modules.tar.gz --repo "$GITHUB_REPOSITORY"
          gh attestation verify release-assets/VIP_All_Modules.spdx.json --repo "$GITHUB_REPOSITORY"
          python3 .github/scripts/verify_spdx_subject.py \
            --archive release-assets/VIP_All_Modules.tar.gz \
            --sbom release-assets/VIP_All_Modules.spdx.json
          echo "Release contains 37 tar.gz assets and the combined SPDX SBOM."
